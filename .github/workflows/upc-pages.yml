# Publishes this site from the guillen-it/upc copy of the repo, served at
# guillen.tsc.upc.edu (custom domain set in upc's Settings -> Pages).
# In guillen-it.github.io itself the job is skipped: that site deploys from
# the branch, and guillen.eng.cam.ac.uk reverse-proxies it.
name: Deploy UPC copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'guillen-it/upc'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
